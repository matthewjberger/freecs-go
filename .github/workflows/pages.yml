name: Github Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-github-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build breakout wasm bundle
        working-directory: examples/breakout
        env:
          GOOS: js
          GOARCH: wasm
        run: |
          go build -o docs/main.wasm .
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" docs/wasm_exec.js

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: examples/breakout/docs
          single-commit: true
