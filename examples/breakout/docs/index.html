<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Breakout — freecs-go + wgpu</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0c0f1a; color: #ddd; font-family: system-ui, sans-serif; }
  body { display: flex; flex-direction: column; }
  #status { padding: 6px 12px; font-size: 13px; color: #cdd; }
  #controls { padding: 0 12px 6px; font-size: 12px; color: #889; }
  #canvas { flex: 1 1 auto; display: block; width: 100%; height: 100%; }
  a { color: #ffb86c; }
</style>
</head>
<body>
<div id="status"></div>
<div id="controls">← / → move &nbsp;·&nbsp; space launches &nbsp;·&nbsp; R restarts after win/loss</div>
<canvas id="canvas" tabindex="0" width="1280" height="720"></canvas>

<script src="wasm_exec.js"></script>
<script>
  const status = document.getElementById('status');
  const canvas = document.getElementById('canvas');
  canvas.focus();
  canvas.addEventListener('click', () => canvas.focus());

  if (!navigator.gpu) {
    status.textContent = 'WebGPU is not available in this browser. Try Chrome / Edge, or Firefox 141+, or Safari 26+.';
  } else {
    status.textContent = 'Loading Breakout (freecs-go + wgpu)…';
    const go = new Go();
    WebAssembly.instantiateStreaming(fetch('main.wasm'), go.importObject)
      .then((result) => {
        // cogentcore/webgpu's jsx.BytesToJS reads wasm memory via
        // window.wasm.instance.exports.mem.buffer
        window.wasm = result;
        status.textContent = '';
        go.run(result.instance);
      })
      .catch((err) => {
        status.textContent = 'Failed to load wasm: ' + err;
        console.error(err);
      });
  }
</script>
</body>
</html>
